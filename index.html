<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="index-page">
    <h2>Inicio de Sesión</h2>
    <img src="images/mole1.png" alt="Imagen de inicio de sesión" class="login-image">
    <form id="loginForm" action="/login" method="POST">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" name="username" required><br>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        <p><a href="register.html">¿No tienes cuenta? Regístrate</a>
            <a href="reset-password.html">¿Olvidaste tu contraseña?</a>
        </p>

        <button type="submit">Iniciar Sesión</button>
    </form>

    <script>
        document.querySelector("#loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const username = document.querySelector("#username").value;
            const password = document.querySelector("#password").value;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json().catch(() => ({})); // ← evita errores si JSON no es válido

                if (!res.ok) {
                    const message = data.error || "Error desconocido.";
                    showModal(message);
                    return;
                }

                // Si todo bien, redirige
                window.location.href = `/welcome.html?username=${encodeURIComponent(data.username)}`;
            } catch (err) {
                showModal("Error de red: " + err.message);
            }
        });


        function showModal(message) {
            Swal.fire({
                icon: 'error',
                title: 'Error al iniciar sesión',
                text: message,
                confirmButtonText: 'Entendido',
            });
        }

    </script>


</body>




<!-- Modal básico -->


</html>
